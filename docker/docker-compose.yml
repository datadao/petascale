services:
  daemon:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: petascale-daemon
    container_name: petascale-daemon
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_PATH: /data/petascale.db
    volumes:
      - /data/petascale:/data
      - ../config:/app/config:ro
    logging:
      driver: journald
      options:
        tag: petascale

  analytics:
    build:
      context: ..
      dockerfile: docker/Dockerfile.analytics
    image: petascale-analytics
    container_name: petascale-analytics
    restart: unless-stopped
    environment:
      DB_PATH: /data/petascale.db
    volumes:
      - /data/petascale:/data
      - ../config:/app/config:ro
    logging:
      driver: journald
      options:
        tag: petascale-analytics

  dashboard:
    image: nginx:alpine
    container_name: petascale-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - /data/petascale:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: journald
      options:
        tag: petascale-dashboard
