# petascale sensor configuration

[[sensors]]
id        = "sensor14/cat_weight_sensor"
ha_entity = "sensor.sensor14_cat_weight_sensor"
name      = "Litter box"
role      = "litterbox"   # litterbox | food | water | scale

# Detection parameters per sensor role.
# See docs/architecture.md and .private/algo/algo.md for the algorithm.
[detection.litterbox]
resample_freq_s        = 1
ffill_cap_s            = 300
baseline_window_s      = 5
noise_threshold_g      = 10
segment_buffer_s       = 60
event_delta_g          = 10
min_potty_peak_delta_g = 500
min_cleaning_drop_g    = 100
min_event_duration_s   = 3
max_event_duration_s   = 600
plateau_round_g        = 0.5
iqr_multiplier         = 1.5
warm_window_minutes    = 15
warm_interval_seconds  = 60

[warm]
# Algorithm names to run on every warm-path tick. Each algo writes events
# tagged with its own name so results can be compared. Registered algos:
# "v1" — rolling-baseline segment pipeline (current).
active_algos = ["v1"]

# Cat profiles live in cats.local.toml (gitignored).
# See config/cats.local.toml.example for the schema.
